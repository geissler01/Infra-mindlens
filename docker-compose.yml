version: '3.8'

services:
  web-proxy:
    image: nginx:alpine
    container_name: web-proxy
    ports:
      - "85:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - journal-net

  # Único servicio de Base de Datos (Múltiples DBs internamente)
  db:
    image: pgvector/pgvector:pg15
    container_name: postgres-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-journal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-journal_pass}
      POSTGRES_DB: ${POSTGRES_DB:-journal_db}
    ports:
      - "54320:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/database/init:/docker-entrypoint-initdb.d
      - ./backend/database/schema:/docker-entrypoint-initdb.d/schema
      - ./backend/database/seeds:/docker-entrypoint-initdb.d/seeds
    networks:
      - journal-net

  # Visualizador de Bases de Datos
  adminer:
    image: adminer
    container_name: adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - journal-net

  localstack:
    image: localstack/localstack:3.5.0
    container_name: localstack
    environment:
      - DEBUG=1
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    ports:
      - "4566:4566"
    volumes:
      - ./localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - journal-net

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-dotnet
    environment:
      - MASTER_DB_HOST=db
      - MASTER_DB_NAME=master_db
      - MASTER_DB_USER=${POSTGRES_USER:-journal_user}
      - MASTER_DB_PASS=${POSTGRES_PASSWORD:-journal_pass}
      - TENANT_DB_HOST=db
      - TENANT_DB_NAME=${POSTGRES_DB:-journal_db}
      - TENANT_DB_USER=${POSTGRES_USER:-journal_user}
      - TENANT_DB_PASS=${POSTGRES_PASSWORD:-journal_pass}
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_ENDPOINT_URL=http://localstack:4566
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/journal-processing-queue
    depends_on:
      - db
      - localstack
    networks:
      - journal-net

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: worker-python
    environment:
      - MASTER_DB_HOST=db
      - MASTER_DB_NAME=master_db
      - MASTER_DB_USER=${POSTGRES_USER:-journal_user}
      - MASTER_DB_PASS=${POSTGRES_PASSWORD:-journal_pass}
      - TENANT_DB_HOST=db
      - TENANT_DB_NAME=${POSTGRES_DB:-journal_db}
      - TENANT_DB_USER=${POSTGRES_USER:-journal_user}
      - TENANT_DB_PASS=${POSTGRES_PASSWORD:-journal_pass}
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_ENDPOINT_URL=http://localstack:4566
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/journal-processing-queue
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - db
      - localstack
    networks:
      - journal-net

volumes:
  pgdata:

networks:
  journal-net:
    driver: bridge
