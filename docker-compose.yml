version: '3.8'

services:
  web-proxy:
    image: nginx:alpine
    container_name: web-proxy
    ports:
      - "85:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - journal-net

  db:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-journal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-journal_pass}
      POSTGRES_DB: ${POSTGRES_DB:-journal_db}
    ports:
      - "5475:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - journal-net

  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    environment:
      - SERVICES=s3,sqs
      - DEBUG=1
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    ports:
      - "4566:4566"
    volumes:
      - ./localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - journal-net

  backend:
    # El equipo de .NET deberá reemplazar este Dockerfile por el suyo
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-dotnet
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB:-journal_db};Username=${POSTGRES_USER:-journal_user};Password=${POSTGRES_PASSWORD:-journal_pass}
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_SERVICE_URL=http://localstack:4566
    ports:
      - "5000:80" # ASP.NET Core normalmente expone el 80 en los contenedores
    depends_on:
      - db
      - localstack
    networks:
      - journal-net

  worker:
    # El equipo de Python deberá reemplazar este Dockerfile por el suyo
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: worker-python
    environment:
      - DB_HOST=db
      - DB_NAME=${POSTGRES_DB:-journal_db}
      - DB_USER=${POSTGRES_USER:-journal_user}
      - DB_PASS=${POSTGRES_PASSWORD:-journal_pass}
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_ENDPOINT_URL=http://localstack:4566
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - db
      - localstack
    networks:
      - journal-net

volumes:
  pgdata:

networks:
  journal-net:
    driver: bridge
